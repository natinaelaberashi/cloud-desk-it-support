name: Deploy dashboard to GitHub Pages
# Redeploy requested; public-site verification runs after publishing.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp deployed commit
        run: echo "$GITHUB_SHA" > deployment-version.txt
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public deployment
        run: python analytics/verify_live.py "https://natinaelaberashi.github.io/cloud-desk-it-support/" "$GITHUB_SHA"
