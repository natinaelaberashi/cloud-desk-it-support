name: Analytics checks
on:
  push:
    paths:
      - 'analytics/**'
      - 'data/incidents.csv'
      - 'sql/**'
      - '.github/workflows/analytics-ci.yml'
  pull_request:
    paths:
      - 'analytics/**'
      - 'data/incidents.csv'
      - 'sql/**'
      - '.github/workflows/analytics-ci.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s analytics -p 'test_*.py' -v
      - name: Generate and validate extended synthetic data
        run: python analytics/generate_data.py --output /tmp/incidents_extended.csv
      - name: Confirm generated CSV matches committed dashboard dataset
        run: cmp /tmp/incidents_extended.csv data/incidents_extended.csv
      - name: Generate reproducible metrics
        run: python analytics/analyze.py --output /tmp/service-desk-metrics.json
